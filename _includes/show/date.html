{% assign wday = include.date | date: '%w' | to_integer -%}
{%- assign en = include.date | date: '%a' -%}
{%- assign ja = site.ja_weekdays[wday] %}
<strong>{{ include.date | date: '%-m/%-e' }}</strong>
<span class="weekday"><span class="weekday-parenthesis">（</span>{% include bitext.html en=en ja=ja %}<span class="weekday-parenthesis">）</span></span>

collections:
  shows:

exclude:
  - README.md
  - '**/README.md'

  # Jekyll defaults, which would otherwise get overridden.
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

theme: null

ja_weekdays: [日, 月, 火, 水, 木, 金, 土]

---
title: Songs
section: songs
---
<ul id="song-list">
{% for song in site.songs -%}
<li class="song-list-item">
<a class="song-list-link" href="{{ song.url | relative_url | escape }}">
<img class="song-list-cover" src="{{ 'covers/' | append: song.slug | append: '.jpg' | relative_url | escape }}" alt="">
{{ song.title | escape }}
</a>
</li>
{%- endfor %}
</ul>
